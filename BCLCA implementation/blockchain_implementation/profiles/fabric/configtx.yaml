Organizations:
    - &ATCOrderer
        Name: ATCOrderer
        ID: ATCOrdererMSP
        MSPDir: ./crypto-config/ordererOrganizations/atc.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('ATCOrdererMSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('ATCOrdererMSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('ATCOrdererMSP.admin')"
        OrdererEndpoints:
            - orderer.atc.com:7050
            - orderer2.atc.com:7150
            - orderer3.atc.com:7250
            - orderer4.atc.com:7350

    - &EastChina
        Name: EastChina
        ID: EastChinaMSP
        MSPDir: ./crypto-config/peerOrganizations/eastchina.atc.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('EastChinaMSP.admin', 'EastChinaMSP.peer', 'EastChinaMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('EastChinaMSP.admin', 'EastChinaMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('EastChinaMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('EastChinaMSP.peer')"

        AnchorPeers:
            - Host: info_department.eastchina.atc.com
              Port: 7051

    - &NorthChina
        Name: NorthChina
        ID: NorthChinaMSP
        MSPDir: ./crypto-config/peerOrganizations/northchina.atc.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('NorthChinaMSP.admin', 'NorthChinaMSP.peer', 'NorthChinaMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('NorthChinaMSP.admin', 'NorthChinaMSP.client')"
                #Rule: "OR('Org2MSP.admin')"
            Admins:
                Type: Signature
                Rule: "OR('NorthChinaMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('NorthChinaMSP.peer')"

        AnchorPeers:
            - Host: info_department.northchina.atc.com
              Port: 7061

    - &AirChina
        Name: AirChina
        ID: AirChinaMSP
        MSPDir: ./crypto-config/peerOrganizations/airchina.atc.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('AirChinaMSP.admin', 'AirChinaMSP.peer', 'AirChinaMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('AirChinaMSP.admin', 'AirChinaMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('AirChinaMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('AirChinaMSP.peer')"

        AnchorPeers:
            - Host: info_department.airchina.atc.com
              Port: 8051

    - &Csair
        Name: Csair
        ID: CsairMSP
        MSPDir: ./crypto-config/peerOrganizations/csair.atc.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('CsairMSP.admin', 'CsairMSP.peer', 'CsairMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('CsairMSP.admin', 'CsairMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('CsairMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('CsairMSP.peer')"

        AnchorPeers:
            - Host: info_department.csair.atc.com
              Port: 8061


Capabilities:
    Channel: &ChannelCapabilities
        V3_0: true
    Orderer: &OrdererCapabilities
        V2_0: true
    Application: &ApplicationCapabilities
        V2_5: true

Application: &ApplicationDefaults

    Organizations:

    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"

    Capabilities:
        <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
    BatchTimeout: 2s

    # Batch Size: Controls the number of messages batched into a block
    BatchSize:

        MaxMessageCount: 10

        AbsoluteMaxBytes: 99 MB

        PreferredMaxBytes: 512 KB

    Organizations:

    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        # BlockValidation specifies what signatures must be included in the block
        # from the orderer for the peer to validate it.
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"

Channel: &ChannelDefaults

    Policies:
        # Who may invoke the 'Deliver' API
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        # Who may invoke the 'Broadcast' API
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        # By default, who may modify elements at this config level
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"

    Capabilities:
        <<: *ChannelCapabilities

Profiles:
    ChannelUsingBFT:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *ATCOrderer
            Capabilities:
                <<: *OrdererCapabilities
            OrdererType: BFT
            SmartBFT:
                RequestBatchMaxCount: 100
                RequestBatchMaxInterval: 50ms
                RequestForwardTimeout: 2s
                RequestComplainTimeout: 20s
                RequestAutoRemoveTimeout: 3m0s
                ViewChangeResendInterval: 5s
                ViewChangeTimeout: 20s
                LeaderHeartbeatTimeout: 1m0s
                CollectTimeout: 1s
                RequestBatchMaxBytes: 10485760
                IncomingMessageBufferSize: 200
                RequestPoolSize: 100000
                LeaderHeartbeatCount: 10
            ConsenterMapping:
                - ID: 1
                  Host: orderer.atc.com
                  Port: 7050
                  MSPID: ATCOrdererMSP
                  Identity: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer.atc.com/msp/signcerts/orderer.atc.com-cert.pem
                  ClientTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer.atc.com/tls/server.crt
                  ServerTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer.atc.com/tls/server.crt
                - ID: 2
                  Host: orderer2.atc.com
                  Port: 7150
                  MSPID: ATCOrdererMSP
                  Identity: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer2.atc.com/msp/signcerts/orderer2.atc.com-cert.pem
                  ClientTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer2.atc.com/tls/server.crt
                  ServerTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer2.atc.com/tls/server.crt
                - ID: 3
                  Host: orderer3.atc.com
                  Port: 7250
                  MSPID: ATCOrdererMSP
                  Identity: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer3.atc.com/msp/signcerts/orderer3.atc.com-cert.pem
                  ClientTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer3.atc.com/tls/server.crt
                  ServerTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer3.atc.com/tls/server.crt
                - ID: 4
                  Host: orderer4.atc.com
                  Port: 7350
                  MSPID: ATCOrdererMSP
                  Identity: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer4.atc.com/msp/signcerts/orderer4.atc.com-cert.pem
                  ClientTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer4.atc.com/tls/server.crt
                  ServerTLSCert: ./crypto-config/ordererOrganizations/atc.com/orderers/orderer4.atc.com/tls/server.crt
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *EastChina
                - *NorthChina
                - *AirChina
                - *Csair
            Capabilities:
                <<: *ApplicationCapabilities
        
        
        
        
        
        
        
        
        
        
        
        
        
    
